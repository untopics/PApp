name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.MINIHUB_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.MINIHUB_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PW" ]; then
            echo "::error::Secrets MINIHUB_KEYSTORE_BASE64 and MINIHUB_KEYSTORE_PASSWORD must be set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          # tr strips whitespace/line breaks that pasting can introduce
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "::notice::Keystore: $(stat -c %s "$RUNNER_TEMP/release.jks") bytes, sha256 $(sha256sum "$RUNNER_TEMP/release.jks" | cut -c1-16)"
          if ! out=$(keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PW" -alias minihub 2>&1); then
            echo "::error::Keystore check failed: $(echo "$out" | grep -v JAVA_TOOL_OPTIONS | tail -3 | tr '\n' ' ')"
            exit 1
          fi
          echo "MINIHUB_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          MINIHUB_KEYSTORE_PASSWORD: ${{ secrets.MINIHUB_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          if ! gradle :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            # Surface the Gradle failure as annotations so it is readable without the raw log
            # (one annotation, %0A = newline; GitHub caps the number of annotations per step)
            msg=$(grep -E "^e: |error:|What went wrong" -A6 "$RUNNER_TEMP/gradle.log" | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error::${msg:-Gradle failed, no error lines matched}"
            exit 1
          fi
      - name: Verify release signature
        env:
          # SHA-256 of the MiniHub release certificate; a different key fails the build
          EXPECTED_CERT_SHA256: 2cb52c84968bc801d1d5acab5223d863f9b1aae10211424e4a31bd08448bffc6
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          if ! out=$("$apksigner" verify --print-certs app/build/outputs/apk/release/*.apk 2>&1); then
            echo "::error::apksigner verify failed: $(echo "$out" | tail -3 | tr '\n' ' ')"
            exit 1
          fi
          actual=$(echo "$out" | grep -i "certificate SHA-256 digest" | head -1 | awk '{print $NF}')
          if [ "$actual" = "$EXPECTED_CERT_SHA256" ]; then
            echo "::notice::APK signed with the MiniHub release key (cert SHA-256 $actual)"
          else
            echo "::error::APK signed with an unexpected certificate: SHA-256 ${actual:-not found}, expected $EXPECTED_CERT_SHA256"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with: { name: minihub-apk, path: app/build/outputs/apk/release/*.apk }
